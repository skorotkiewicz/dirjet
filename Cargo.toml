[package]
name = "djet"
version = "0.1.1"
edition = "2024"
description = "A static file server for directories and individual files"
license = "MIT"

[dependencies]
anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
clap = { version = "4", features = ["derive"] }
percent-encoding = "2"
tokio = { version = "1", features = ["fs", "macros", "net", "rt-multi-thread", "signal"] }
tower-http = { version = "0.7", features = ["fs"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "thin"
strip = true
